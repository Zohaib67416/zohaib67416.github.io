<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw</title>

<style>
body{
background:#1b102d;
font-family:Arial;
color:white;
text-align:center;
margin:0;
}
.box{
background:#2a1845;
margin:20px;
padding:20px;
border-radius:10px;
}
input,select{
width:90%;
padding:12px;
margin:10px;
border:none;
border-radius:6px;
}
button{
width:90%;
padding:15px;
background:#b84dff;
color:white;
border:none;
border-radius:6px;
font-size:18px;
}
</style>
</head>

<body>

<h2>Withdraw</h2>

<div class="box">

<select>
<option>JazzCash</option>
<option>EasyPaisa</option>
<option>Binance</option>
</select>

<input type="number" placeholder="Enter Amount">
<input type="text" placeholder="Account Number">

<button>Submit Withdrawal</button>

</div>

</body>
</html>
