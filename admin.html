<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#1b102d;
    color:white;
}
.header{
    background:#2a1845;
    padding:15px;
    text-align:center;
}
.card{
    background:#2a1845;
    margin:20px;
    padding:20px;
    border-radius:10px;
}
button{
    padding:10px 20px;
    background:#b84dff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
<h2>Admin Panel</h2>
</div>

<div class="card">
<h3>Total Users</h3>
<p id="totalUsers">Loading...</p>
</div>

<div class="card">
<h3>Admin Controls</h3>
<button>View Users</button>
<button>Logout</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBL23qVtMr9EdV4qhdXB8DJ9xzWnKQfRU0",
  authDomain: "zohaib-mining.firebaseapp.com",
  projectId: "zohaib-mining",
  storageBucket: "zohaib-mining.firebasestorage.app",
  messagingSenderId: "349772987051",
  appId: "1:349772987051:web:abab3ec726d95a74eb15ee"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if (!user) {
    alert("Please login first!");
    window.location.href = "login.html";
    return;
  }

  if (user.email !== "zabbirajpoot46@gmail.com") {
    alert("Access Denied!");
    window.location.href = "index.html";
    return;
  }
});
  if (!user) {
    alert("Please login first!");
    window.location.href = "login.html";
  }
});

document.querySelectorAll("button")[1].addEventListener("click", () => {
  signOut(auth).then(() => {
    window.location.href = "login.html";
  });
});
</script>
</body>
</html>
