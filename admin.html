<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body{
margin:0;
background:#1b102d;
font-family:Arial,sans-serif;
color:#fff;
}

.header{
background:#2a1845;
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.card{
background:#2a1845;
margin:20px;
padding:20px;
border-radius:10px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#b84dff;
color:#fff;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

#totalUsers{
font-size:22px;
font-weight:bold;
color:#b84dff;
}
</style>
</head>

<body>

<div class="header">
Zohaib Mining Admin Panel
</div>

<div class="card">
<h3>Total Users</h3>
<p id="totalUsers">Loading...</p>
</div>

<div class="card">
<button id="usersBtn">👥 View Users</button>
<button id="depositBtn">💳 Deposit Requests</button>
<button id="withdrawBtn">💸 Withdrawal Requests</button>
<button id="blockedBtn">🚫 Blocked Users</button>
<button id="logoutBtn">🚪 Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBL23qVtMr9EdV4qhdXB8DJ9xzWnKQfRU0",
  authDomain: "zohaib-mining.firebaseapp.com",
  projectId: "zohaib-mining",
  storageBucket: "zohaib-mining.firebasestorage.app",
  messagingSenderId: "349772987051",
  appId: "1:349772987051:web:abab3ec726d95a74eb15ee"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

   onAuthStateChanged(auth, async (user) => {

  if (!user) {
    alert("Please login first!");
    window.location.href = "login.html";
    return;
  }

  // Sirf admin email ko access do
  if (user.email !== "zabbirajpoot46@gmail.com") {
    alert("Access Denied!");
    window.location.href = "index.html";
    return;
  }

  try {
    const usersSnapshot = await getDocs(collection(db, "users"));
    document.getElementById("totalUsers").innerText = usersSnapshot.size;
  } catch (error) {
    console.log(error);
    document.getElementById("totalUsers").innerText = "0";
  }

});

document.getElementById("usersBtn").onclick = () => {
  window.location.href = "users.html";
};

document.getElementById("depositBtn").onclick = () => {
  window.location.href = "deposit-requests.html";
};

document.getElementById("withdrawBtn").onclick = () => {
  window.location.href = "withdraw-requests.html";
};

document.getElementById("blockedBtn").onclick = () => {
  window.location.href = "blocked-users.html";
}; 
   document.getElementById("logoutBtn").addEventListener("click", async () => {
  try {
    await signOut(auth);
    alert("Logged out successfully!");
    window.location.href = "login.html";
  } catch (error) {
    alert(error.message);
  }
});

</script>

</body>
</html>
