i<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit Requests</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#1b102d;
    color:white;
    padding:20px;
}
h2{
    text-align:center;
}
.card{
    background:#2a1845;
    padding:15px;
    margin:15px 0;
    border-radius:10px;
}
button{
    padding:10px 15px;
    border:none;
    border-radius:6px;
    background:#b84dff;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<h2>💳 Deposit Requests</h2>

<div id="list">Loading...</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBL23qVtMr9EdV4qhdXB8DJ9xzWnKQfRU0",
  authDomain: "zohaib-mining.firebaseapp.com",
  projectId: "zohaib-mining",
  storageBucket: "zohaib-mining.firebasestorage.app",
  messagingSenderId: "349772987051",
  appId: "1:349772987051:web:abab3ec726d95a74eb15ee"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    alert("Please login first!");
    window.location.href = "login.html";
    return;
  }

  try {

    const snapshot = await getDocs(collection(db,"deposits"));

    let html = "";

    snapshot.forEach((doc)=>{

      const data = doc.data();

      html += `
      <div class="card">
      <b>Email:</b> ${data.email || "Unknown"}<br><br>
      <b>Method:</b> ${data.method || "Unknown"}<br><br>
      <b>Status:</b> ${data.status || "Pending"}
      </div>
      `;

    });

    if(html===""){
      html="<h3>No Deposit Requests</h3>";
    }

    document.getElementById("list").innerHTML=html;

  } catch(e){

    document.getElementById("list").innerHTML="<h3>"+e.message+"</h3>";
    console.log(e);

  }

});

</script>

</body>
</html>
