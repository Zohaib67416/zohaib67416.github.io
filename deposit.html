
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deposit - Zohaib Mining</title>

<style>
body{
    margin:0;
    background:#1b102d;
    color:white;
    font-family:Arial,sans-serif;
}

.header{
    background:#2a1845;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.card{
    background:#2a1845;
    margin:20px;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    box-sizing:border-box;
    border:none;
    border-radius:6px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#b84dff;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.back{
    background:#444;
}
</style>
</head>

<body>

<div class="header">
    Deposit
</div>

<div class="card">

    <h3>JazzCash Deposit</h3>

    <p>Account Number:</p>

    <h3 id="accountNumber">
        03183807372
    </h3>

    <button id="copyBtn">
        📋 Copy Account Number
    </button>

    <hr>

    <label>Enter Amount</label>

    <input
        type="number"
        id="amount"
        placeholder="Enter deposit amount"
        min="1"
    >

    <button id="paidBtn">
        ✅ I Have Paid
    </button>

    <button class="back" onclick="window.location.href='index.html'">
        ← Back
    </button>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyBL23qVtMr9EdV4qhdXB8DJ9xzWnKQfRU0",

    authDomain: "zohaib-mining.firebaseapp.com",

    projectId: "zohaib-mining",

    storageBucket: "zohaib-mining.firebasestorage.app",

    messagingSenderId: "349772987051",

    appId: "1:349772987051:web:abab3ec726d95a74eb15ee"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* LOGIN CHECK */

onAuthStateChanged(auth, (user) => {

    if(!user){

        alert("Please login first!");

        window.location.href = "login.html";

    }

});


/* COPY NUMBER */

document
.getElementById("copyBtn")
.addEventListener("click", async () => {

    try{

        await navigator.clipboard.writeText(
            "03183807372"
        );

        alert("Account Number Copied!");

    }catch(error){

        alert("Copy failed. Number: 03183807372");

    }

});


/* PAID BUTTON */

document
.getElementById("paidBtn")
.addEventListener("click", async () => {

    const user = auth.currentUser;

    if(!user){

        alert("Please login first!");

        window.location.href = "login.html";

        return;

    }


    const amount =
        document
        .getElementById("amount")
        .value;


    if(!amount || Number(amount) <= 0){

        alert("Please enter a valid amount!");

        return;

    }


    const button =
        document.getElementById("paidBtn");

    button.disabled = true;

    button.innerText = "Submitting...";


    try{

        await addDoc(
            collection(db, "deposits"),
            {

                uid: user.uid,

                email: user.email,

                amount: Number(amount),

                method: "JazzCash",

                status: "Pending",

                createdAt: serverTimestamp()

            }
        );


        alert(
            "Deposit request submitted successfully!"
        );


        document.getElementById("amount").value = "";


    }catch(error){

        console.log(error);

        alert(
            "Error: " + error.message
        );
