<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Zohaib Mining</title>

<style>
body{
    margin:0;
    background:#1b102d;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{
    background:#2a1845;
    padding:30px;
    border-radius:10px;
    width:300px;
    text-align:center;
}
h2{
    color:#b84dff;
}
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:5px;
}
button{
    width:100%;
    padding:12px;
    background:#b84dff;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
}
a{
    color:#b84dff;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="box">
<h2>Login</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button id="loginBtn">Login</button>

<p>Don't have an account?</p>

<button onclick="window.location.href='signup.html'">Sign Up</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyBL23qVtMr9EdV4qhdXB8DJ9xzWnKQfRU0",
  authDomain: "zohaib-mining.firebaseapp.com",
  projectId: "zohaib-mining",
  storageBucket: "zohaib-mining.firebasestorage.app",
  messagingSenderId: "349772987051",
  appId: "1:349772987051:web:abab3ec726d95a74eb15ee"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    await setPersistence(auth, browserLocalPersistence);

    await signInWithEmailAndPassword(auth, email, password);

    alert("Login Successful!");

    window.location.href = "admin.html";

  } catch (error) {
    alert(error.message);
  }
});
  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      alert("Login Successful!");
      window.location.href = "admin.html";
    })
    .catch((error) => {
      alert(error.message);
    });
});
</script>
</body>
</html>
