<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Zohaib Mining</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#1b102d;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    background:#2a1845;
    padding:30px;
    border-radius:10px;
    width:320px;
    text-align:center;
}

h2{
    color:#b84dff;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:6px;
    outline:none;
}

button{
    width:100%;
    padding:12px;
    background:#b84dff;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

button:disabled{
    opacity:0.6;
}

p{
    color:#ddd;
    font-size:14px;
    margin-top:18px;
}
</style>
</head>

<body>

<div class="box">

    <h2>Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button id="loginBtn">Login</button>

    <p>Don't have an account?</p>

    <button onclick="window.location.href='signup.html'">
        Sign Up
    </button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey: "AIzaSyBL23qVtMr9EdV4qhdXB8DJ9xzWnKQfRU0",

    authDomain: "zohaib-mining.firebaseapp.com",

    projectId: "zohaib-mining",

    storageBucket: "zohaib-mining.firebasestorage.app",

    messagingSenderId: "349772987051",

    appId: "1:349772987051:web:abab3ec726d95a74eb15ee"

};


/* START FIREBASE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/* LOGIN */

document
.getElementById("loginBtn")
.addEventListener("click", async () => {

    const email =
        document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password =
        document
        .getElementById("password")
        .value;


    if (!email || !password) {

        alert("Please enter email and password!");

        return;
    }


    const button =
        document.getElementById("loginBtn");

    button.disabled = true;

    button.innerText = "Logging in...";


    try {

        await setPersistence(
            auth,
            browserLocalPersistence
        );


        const userCredential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user = userCredential.user;


        /*
         * ADMIN EMAIL
         */

        if (
            user.email &&
            user.email.toLowerCase()
            === "zabbirajpoot46@gmail.com"
        ) {

            alert("Admin Login Successful!");

            window.location.href = "admin.html";

        } else {

            alert("Login Successful!");

            window.location.href = "index.html";

        }


    } catch (error) {

        console.log(error);

        alert(
            "Login failed: " +
            error.message
        );

        button.disabled = false;

        button.innerText = "Login";

    }

});

</script>

</body>
</html>
